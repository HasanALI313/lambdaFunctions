name: Lambda CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate, build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lambda_project/lambda_proj

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            lambda_project/lambda_proj/hello_world/requirements.txt

      - name: Verify Python environment
        run: |
          which python
          python --version

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Verify SAM CLI
        run: sam --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r hello_world/requirements.txt
          python -m pip install -r tests/integration/requirements.txt
      
        run: |
          python -m pip show boto3
          python -c "import boto3; print('boto3 version:', boto3.__version__)"


      - name: Validate SAM template
        run: sam validate --lint

      - name: Build SAM application
        run: sam build --use-container

      - name: Run integration tests
        run: |
          python -m pytest tests/integration \
            --verbose \
            --cov=hello_world \
            --cov-report=term-missing