name: Lambda CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate, build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lambda_project/lambda_proj

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            lambda_project/lambda_proj/hello_world/requirements.txt

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Install dependencies
        run: |
          echo: Hello Testing 123!!!
          python -m pip install --upgrade pip
          python -m pip install -r hello_world/requirements.txt
          python -m pip install pytest pytest-cov

          if [ -f tests/integration/requirements.txt ]; then
            python -m pip install -r tests/integration/requirements.txt
          fi

      - name: Validate SAM template
        run: sam validate --lint

      - name: Build SAM application
        run: sam build

      - name: Run integration tests
        run: |
          python -m pytest tests/integration \
            --verbose \
            --cov=hello_world \
            --cov-report=term-missing